<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Vault</title>
<style>
:root {
  --bg:      #1a1a2e;
  --panel:   #16213e;
  --card:    #0f3460;
  --accent:  #e94560;
  --accent2: #533483;
  --text:    #eaeaea;
  --muted:   #8892a4;
  --inbg:    #0d2137;
  --success: #4ade80;
  --warning: #facc15;
  --danger:  #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

/* ── lock screen ── */
#lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
.card { background: var(--panel); border-radius: 12px; padding: 36px; width: 100%; max-width: 400px; }
.card-icon { font-size: 3rem; text-align: center; margin-bottom: 8px; }
.card h1 { font-size: 1.6rem; text-align: center; margin-bottom: 4px; }
.card .subtitle { color: var(--muted); font-size: 0.82rem; text-align: center; margin-bottom: 28px; }

label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; margin-top: 12px; }
input[type=text], input[type=password] {
  width: 100%; padding: 10px 14px; background: var(--inbg); border: 1.5px solid var(--card);
  border-radius: 6px; color: var(--text); font-size: 1rem; outline: none; transition: border-color .15s;
}
input:focus { border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; transition: opacity .15s; text-decoration: none;
}
.btn:hover { opacity: 0.82; }
.btn-primary   { background: var(--accent);  color: #fff; }
.btn-secondary { background: var(--card);    color: var(--text); }
.btn-muted     { background: var(--card);    color: var(--muted); }
.btn-danger    { background: transparent;    color: var(--danger); border: 1px solid var(--danger); }
.btn-full { width: 100%; margin-top: 16px; }
.btn-sm { padding: 5px 11px; font-size: 0.8rem; }

.error-msg  { color: var(--danger);  font-size: 0.83rem; min-height: 1.1em; margin-top: 10px; }
.flash-msg  { color: var(--success); font-size: 0.83rem; text-align: center; padding: 8px;
              position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); z-index: 50; }

/* hint */
.hint-toggle { background: none; border: none; color: var(--muted); cursor: pointer;
               font-size: 0.83rem; padding: 0; margin-top: 16px; display: block; }
.hint-box { color: var(--warning); font-size: 0.83rem; margin-top: 8px;
            background: var(--card); padding: 10px 14px; border-radius: 6px; }
.first-run-note { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 16px; }

/* ── vault screen ── */
#vault-screen { display: none; flex-direction: column; min-height: 100vh; }
.topbar {
  background: var(--panel); padding: 10px 14px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 10;
}
.topbar h2 { font-size: 1rem; margin-right: auto; }
.search-wrap { padding: 10px 14px 4px; }
.search-wrap input { margin-bottom: 0; }
.entries-list { padding: 4px 14px 72px; }

/* entry card */
.entry-card {
  background: var(--card); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.entry-info { flex: 1; min-width: 0; }
.entry-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-meta { color: var(--muted); font-size: 0.78rem; margin-top: 2px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-tags { font-size: 0.73rem; margin-top: 3px; }
.tag-reused { color: var(--danger); }
.tag-weak   { color: var(--warning); }
.tag-old    { color: #f97316; }
.entry-actions { display: flex; gap: 5px; flex-shrink: 0; }
.empty-msg { color: var(--muted); text-align: center; padding: 48px 0; }

/* ── modal ── */
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
  align-items: center; justify-content: center; z-index: 100; padding: 14px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg); border-radius: 12px; padding: 24px; width: 100%; max-width: 440px;
  max-height: 92vh; overflow-y: auto;
}
.modal h2 { margin-bottom: 16px; }
.modal-btns { display: flex; gap: 8px; margin-top: 18px; }
.modal-btns .btn { flex: 1; }

/* pw field with eye */
.pw-row { position: relative; }
.pw-row input { padding-right: 40px; }
.pw-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
          background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0; }

/* strength */
.strength-bar  { height: 4px; background: var(--card); border-radius: 2px; margin-top: 6px; }
.strength-fill { height: 100%; border-radius: 2px; transition: width .2s, background .2s; }
.strength-lbl  { font-size: 0.75rem; color: var(--muted); margin-top: 3px; margin-bottom: 12px; min-height: 1em; }

/* pw display */
.pw-display {
  font-family: monospace; font-size: 1.05rem; background: var(--inbg); color: var(--success);
  padding: 12px 14px; border-radius: 6px; word-break: break-all; margin: 10px 0; letter-spacing: 1px;
}

/* history */
.hist-item {
  background: var(--panel); border-radius: 6px; padding: 8px 12px; margin-bottom: 5px;
  display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 0.88rem;
}
.hist-dots { flex: 1; color: var(--muted); }
.hist-age  { color: var(--muted); font-size: 0.75rem; }

/* health */
.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 18px; }
.score-cell { background: var(--card); border-radius: 8px; padding: 10px; text-align: center; }
.score-num  { font-size: 1.4rem; font-weight: 700; }
.score-lbl  { font-size: 0.72rem; color: var(--muted); }
.health-section h3 { font-size: 0.9rem; margin: 14px 0 6px; }
.health-row { background: var(--card); border-radius: 6px; padding: 9px 12px; margin-bottom: 5px;
              display: flex; align-items: center; gap: 8px; }
.health-name { flex: 1; font-weight: 600; font-size: 0.9rem; }

@media (max-width: 480px) {
  .entry-card { flex-direction: column; align-items: flex-start; }
  .entry-actions { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="card">
    <div class="card-icon">🔐</div>
    <h1>Password Vault</h1>
    <p class="subtitle">Encrypted · Offline · Yours</p>

    <label for="master-pw">Master password</label>
    <input type="password" id="master-pw" placeholder="Enter master password" autocomplete="current-password">

    <div id="hint-section" style="display:none">
      <button class="hint-toggle" id="hint-btn" onclick="toggleHint()">💡 Show hint</button>
      <div class="hint-box" id="hint-box" style="display:none"></div>
    </div>

    <div id="hint-input-section" style="display:none">
      <label for="hint-input">Hint (optional)</label>
      <input type="text" id="hint-input" placeholder="e.g. favourite song + birth year" autocomplete="off">
      <p style="color:var(--muted);font-size:0.75rem;margin-top:4px">Shown on lock screen — never put the actual password here.</p>
    </div>

    <div class="error-msg" id="lock-error"></div>
    <button class="btn btn-primary btn-full" onclick="doUnlock()">Unlock Vault</button>
    <p class="first-run-note" id="first-run-note" style="display:none">First time? Any password creates a new vault.</p>
  </div>
</div>

<!-- VAULT SCREEN -->
<div id="vault-screen">
  <div class="topbar">
    <h2>🔐 Vault</h2>
    <button class="btn btn-muted btn-sm" onclick="openHintModal()">💡 Hint</button>
    <button class="btn btn-muted btn-sm" onclick="openHealth()">🛡 Health</button>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add</button>
    <button class="btn btn-muted btn-sm" onclick="doLock()">Lock</button>
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍  Search…" oninput="renderEntries()">
  </div>
  <div class="entries-list" id="entries-list"></div>
  <div class="flash-msg" id="flash-msg"></div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="entry-modal">
  <div class="modal">
    <h2 id="entry-modal-title">Add Entry</h2>
    <label>Site / Name *</label>
    <input type="text" id="f-name" placeholder="e.g. Google" autocomplete="off">
    <label>Username / Email</label>
    <input type="text" id="f-username" placeholder="user@example.com" autocomplete="off">
    <label>URL</label>
    <input type="text" id="f-url" placeholder="https://…" autocomplete="off">
    <label>Password *</label>
    <div class="pw-row">
      <input type="password" id="f-pw" placeholder="Password" oninput="updateStrength()" autocomplete="new-password">
      <button class="pw-eye" onclick="toggleEye('f-pw', this)">👁</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="s-fill"></div></div>
    <div class="strength-lbl" id="s-lbl"></div>
    <button class="btn btn-secondary btn-sm" onclick="generatePw()" style="margin-bottom:12px">Generate password</button>
    <label>Notes</label>
    <input type="text" id="f-notes" placeholder="Optional" autocomplete="off">
    <div id="hist-section" style="display:none; margin-top:14px">
      <label style="margin-top:0">Password history</label>
      <div id="hist-list"></div>
    </div>
    <div class="error-msg" id="entry-error"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
      <button class="btn btn-secondary" onclick="closeModal('entry-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- SHOW PASSWORD MODAL -->
<div class="overlay" id="show-modal">
  <div class="modal">
    <h2 id="show-title"></h2>
    <p style="color:var(--muted);font-size:0.82rem;margin-bottom:4px">Current password</p>
    <div class="pw-display" id="show-pw-text"></div>
    <p id="show-strength" style="font-size:0.82rem;margin-bottom:14px"></p>
    <div id="show-history"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="copyAndClose()">Copy &amp; Close</button>
      <button class="btn btn-secondary" onclick="closeModal('show-modal')">Close</button>
    </div>
  </div>
</div>

<!-- HEALTH MODAL -->
<div class="overlay" id="health-modal">
  <div class="modal">
    <h2>🛡 Password Health</h2>
    <div class="score-grid" id="health-score"></div>
    <div id="health-body"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal('health-modal')">Close</button>
    </div>
  </div>
</div>

<!-- HINT MODAL -->
<div class="overlay" id="hint-modal">
  <div class="modal">
    <h2>Password Hint</h2>
    <p style="color:var(--muted);font-size:0.82rem;margin-bottom:12px">Shown on the lock screen. Never put the actual password here.</p>
    <label>Hint</label>
    <input type="text" id="hint-modal-val" placeholder="Leave empty to clear" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveHint()">Save</button>
      <button class="btn btn-secondary" onclick="closeModal('hint-modal')">Cancel</button>
    </div>
  </div>
</div>

<script>
'use strict';
let entries  = [];
let editIdx  = null;
let showIdx  = null;
let flashTmr = null;

// ── boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  const [st, ht] = await Promise.all([
    api('/api/status'),
    api('/api/hint'),
  ]);
  if (st.unlocked) {
    entries = await api('/api/entries');
    showVault();
    return;
  }
  if (st.is_new) {
    show('hint-input-section');
    show('first-run-note');
  } else if (ht.hint) {
    show('hint-section');
    document.getElementById('hint-box').textContent = ht.hint;
  }
  document.getElementById('master-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
}

function toggleHint() {
  const box = document.getElementById('hint-box');
  const btn = document.getElementById('hint-btn');
  const vis = box.style.display !== 'none';
  box.style.display = vis ? 'none' : 'block';
  btn.textContent   = vis ? '💡 Show hint' : '🙈 Hide hint';
}

// ── auth ──────────────────────────────────────────────────────────────────────
async function doUnlock() {
  const pw   = document.getElementById('master-pw').value;
  const hint = document.getElementById('hint-input').value;
  const errEl = document.getElementById('lock-error');
  errEl.textContent = 'Deriving key…';

  const res = await fetch('/api/unlock', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw, hint}),
  });
  const data = await res.json();
  document.getElementById('master-pw').value = '';

  if (!res.ok) { errEl.textContent = data.error; return; }
  errEl.textContent = '';
  entries = await api('/api/entries');
  showVault();
}

async function doLock() {
  await fetch('/api/lock', {method: 'POST'});
  entries = [];
  hide('vault-screen');
  show('lock-screen');
  await boot();
}

function showVault() {
  hide('lock-screen');
  document.getElementById('vault-screen').style.display = 'flex';
  renderEntries();
}

// ── entries ───────────────────────────────────────────────────────────────────
function renderEntries() {
  const q      = document.getElementById('search-input').value.toLowerCase();
  const health = computeHealth();
  const list   = document.getElementById('entries-list');

  const filtered = entries.filter((e, i) =>
    (e.name||'').toLowerCase().includes(q) ||
    (e.username||'').toLowerCase().includes(q) ||
    (e.url||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    list.innerHTML = `<p class="empty-msg">${entries.length ? `No results for "${esc(q)}".` : 'No entries yet — tap + Add.'}</p>`;
    return;
  }

  list.innerHTML = filtered.map(e => {
    const i = entries.indexOf(e);
    const tags = [
      health.reused.has(i) ? '<span class="tag-reused">[reused]</span>' : '',
      health.weak.has(i)   ? '<span class="tag-weak">[weak]</span>'     : '',
      health.old.has(i)    ? '<span class="tag-old">[old]</span>'       : '',
    ].join('');
    const meta = e.username || e.url || '';
    return `<div class="entry-card">
      <div class="entry-info">
        <div class="entry-name">${esc(e.name||'Unnamed')}</div>
        ${meta ? `<div class="entry-meta">${esc(meta)}</div>` : ''}
        ${tags  ? `<div class="entry-tags">${tags}</div>`     : ''}
      </div>
      <div class="entry-actions">
        <button class="btn btn-secondary btn-sm" onclick="copyPw(${i})">Copy</button>
        <button class="btn btn-secondary btn-sm" onclick="showPw(${i})">Show</button>
        <button class="btn btn-secondary btn-sm" onclick="openEditModal(${i})">Edit</button>
        <button class="btn btn-danger btn-sm"    onclick="deleteEntry(${i})">Del</button>
      </div>
    </div>`;
  }).join('');
}

// ── add / edit ────────────────────────────────────────────────────────────────
function openAddModal() {
  editIdx = null;
  document.getElementById('entry-modal-title').textContent = 'Add Entry';
  ['f-name','f-username','f-url','f-pw','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('entry-error').textContent = '';
  document.getElementById('hist-section').style.display = 'none';
  updateStrength();
  openModal('entry-modal');
}

function openEditModal(idx) {
  editIdx = idx;
  const e = entries[idx];
  document.getElementById('entry-modal-title').textContent = 'Edit Entry';
  document.getElementById('f-name').value     = e.name     || '';
  document.getElementById('f-username').value = e.username || '';
  document.getElementById('f-url').value      = e.url      || '';
  document.getElementById('f-pw').value       = e.password || '';
  document.getElementById('f-notes').value    = e.notes    || '';
  document.getElementById('entry-error').textContent = '';
  updateStrength();

  const hist = e.history || [];
  if (hist.length) {
    document.getElementById('hist-section').style.display = 'block';
    document.getElementById('hist-list').innerHTML = hist.map((h, hi) => `
      <div class="hist-item">
        <span class="hist-dots">${'●'.repeat(Math.min(h.password.length, 12))}</span>
        <span class="hist-age">${daysAgo(h.updated)}d ago</span>
        <button class="btn btn-secondary btn-sm" onclick="restorePw(${hi})">Restore</button>
      </div>`).join('');
  } else {
    document.getElementById('hist-section').style.display = 'none';
  }
  openModal('entry-modal');
}

function restorePw(hi) {
  document.getElementById('f-pw').value = entries[editIdx].history[hi].password;
  updateStrength();
}

async function saveEntry() {
  const name = document.getElementById('f-name').value.trim();
  const pw   = document.getElementById('f-pw').value;
  const errEl = document.getElementById('entry-error');
  if (!name) { errEl.textContent = 'Site / Name is required.'; return; }
  if (!pw)   { errEl.textContent = 'Password is required.'; return; }

  const now = new Date().toISOString();
  let entry = {
    name,
    username: document.getElementById('f-username').value.trim(),
    url:      document.getElementById('f-url').value.trim(),
    notes:    document.getElementById('f-notes').value.trim(),
    password: pw,
    updated:  now,
    history:  [],
  };

  if (editIdx !== null) {
    const old  = entries[editIdx];
    let hist   = [...(old.history || [])];
    if (old.password && old.password !== pw) {
      hist.unshift({password: old.password, updated: old.updated || now});
      hist = hist.slice(0, 3);
    }
    entry.history = hist;
    await fetch(`/api/entries/${editIdx}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(entry),
    });
    entries[editIdx] = entry;
    flash(`"${name}" updated.`);
  } else {
    await fetch('/api/entries', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(entry),
    });
    entries.unshift(entry);
    flash(`"${name}" added.`);
  }

  closeModal('entry-modal');
  renderEntries();
}

async function deleteEntry(idx) {
  if (!confirm(`Delete "${entries[idx].name}"?`)) return;
  await fetch(`/api/entries/${idx}`, {method: 'DELETE'});
  entries.splice(idx, 1);
  renderEntries();
  flash('Entry deleted.');
}

// ── show password ─────────────────────────────────────────────────────────────
function showPw(idx) {
  showIdx = idx;
  const e = entries[idx];
  document.getElementById('show-title').textContent   = e.name || '';
  document.getElementById('show-pw-text').textContent = e.password || '';
  const {label, color} = strengthInfo(e.password || '');
  const sl = document.getElementById('show-strength');
  sl.textContent = label; sl.style.color = color;

  const hist = e.history || [];
  document.getElementById('show-history').innerHTML = hist.length ? `
    <p style="color:var(--muted);font-size:0.82rem;margin-bottom:6px">Previous passwords</p>
    ${hist.map(h => `<div class="hist-item">
      <span class="hist-dots">${'●'.repeat(Math.min(h.password.length, 14))}</span>
      <span class="hist-age">${daysAgo(h.updated)}d ago</span>
    </div>`).join('')}` : '';

  openModal('show-modal');
}

function copyAndClose() { copyPw(showIdx); closeModal('show-modal'); }

// ── clipboard ─────────────────────────────────────────────────────────────────
function copyPw(idx) {
  navigator.clipboard.writeText(entries[idx].password)
    .then(() => {
      flash('Copied! Clears in 30s.');
      setTimeout(() => navigator.clipboard.writeText('').catch(()=>{}), 30000);
    })
    .catch(() => flash('Copy failed — use Show instead.'));
}

// ── health ────────────────────────────────────────────────────────────────────
function openHealth() {
  const h     = computeHealth();
  const total = entries.length;
  const nBad  = new Set([...h.reused, ...h.weak, ...h.old]).size;
  const score = Math.max(0, 100 - Math.round(nBad / Math.max(total, 1) * 100));
  const sc    = score >= 80 ? 'var(--success)' : score >= 50 ? 'var(--warning)' : 'var(--danger)';

  document.getElementById('health-score').innerHTML = [
    ['Total',    total,        'var(--text)'],
    ['Reused',   h.reused.size,'var(--danger)'],
    ['Weak',     h.weak.size,  'var(--warning)'],
    ['Outdated', h.old.size,   '#f97316'],
    ['Score',    score,        sc],
  ].map(([l,n,c]) => `<div class="score-cell"><div class="score-num" style="color:${c}">${n}</div><div class="score-lbl">${l}</div></div>`).join('');

  const sections = [
    ['🔁 Reused', h.reused, 'var(--danger)'],
    ['💀 Weak',   h.weak,   'var(--warning)'],
    ['⏰ Old',    h.old,    '#f97316'],
  ];
  const body = sections.map(([title, set, color]) => {
    if (!set.size) return '';
    return `<div class="health-section">
      <h3 style="color:${color}">${title}</h3>
      ${[...set].sort((a,b)=>a-b).map(i => `
        <div class="health-row">
          <span class="health-name">${esc(entries[i]?.name||'?')}</span>
          <button class="btn btn-secondary btn-sm" onclick="closeModal('health-modal');openEditModal(${i})">Fix →</button>
        </div>`).join('')}
    </div>`;
  }).join('');
  document.getElementById('health-body').innerHTML = body ||
    '<p style="color:var(--success);text-align:center;padding:24px">✅ All passwords look healthy!</p>';

  openModal('health-modal');
}

function computeHealth() {
  const pwMap = {};
  entries.forEach((e, i) => { const p = e.password||''; (pwMap[p]=pwMap[p]||[]).push(i); });
  return {
    reused: new Set(Object.values(pwMap).filter(v=>v.length>1).flat()),
    weak:   new Set(entries.map((e,i)=>[e,i]).filter(([e])=>entropy(e.password||'')<50).map(([,i])=>i)),
    old:    new Set(entries.map((e,i)=>[e,i]).filter(([e])=>daysAgo(e.updated)>365).map(([,i])=>i)),
  };
}

// ── hint modal ────────────────────────────────────────────────────────────────
async function openHintModal() {
  const {hint} = await api('/api/hint');
  document.getElementById('hint-modal-val').value = hint || '';
  openModal('hint-modal');
}

async function saveHint() {
  const text = document.getElementById('hint-modal-val').value.trim();
  await fetch('/api/hint', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({hint: text}),
  });
  closeModal('hint-modal');
  flash(text ? 'Hint saved.' : 'Hint cleared.');
}

// ── generate / strength ───────────────────────────────────────────────────────
function generatePw() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+';
  const arr   = new Uint8Array(20);
  crypto.getRandomValues(arr);
  document.getElementById('f-pw').value = Array.from(arr, b => chars[b % chars.length]).join('');
  updateStrength();
}

function entropy(pw) {
  if (!pw) return 0;
  let p = 0;
  if (/[a-z]/.test(pw)) p += 26;
  if (/[A-Z]/.test(pw)) p += 26;
  if (/[0-9]/.test(pw)) p += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) p += 32;
  return pw.length * Math.log2(Math.max(p, 2));
}

function strengthInfo(pw) {
  const b = entropy(pw);
  if (b < 28) return {label:`Very weak (${b.toFixed(0)} bits)`,  color:'var(--danger)'};
  if (b < 36) return {label:`Weak (${b.toFixed(0)} bits)`,       color:'#f97316'};
  if (b < 50) return {label:`Fair (${b.toFixed(0)} bits)`,       color:'var(--warning)'};
  if (b < 70) return {label:`Strong (${b.toFixed(0)} bits)`,     color:'var(--success)'};
  return             {label:`Very strong (${b.toFixed(0)} bits)`, color:'#22d3ee'};
}

function updateStrength() {
  const pw = document.getElementById('f-pw').value;
  const {label, color} = strengthInfo(pw);
  const fill = document.getElementById('s-fill');
  fill.style.width      = Math.min(100, entropy(pw)) + '%';
  fill.style.background = color;
  const lbl = document.getElementById('s-lbl');
  lbl.textContent = pw ? label : '';
  lbl.style.color = color;
}

// ── utilities ─────────────────────────────────────────────────────────────────
function daysAgo(iso) {
  try { return Math.floor((Date.now() - new Date(iso)) / 86400000); } catch { return 0; }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  inp.type  = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function flash(msg) {
  const el = document.getElementById('flash-msg');
  el.textContent = msg;
  clearTimeout(flashTmr);
  flashTmr = setTimeout(() => el.textContent = '', 4000);
}

async function api(url) {
  const res = await fetch(url);
  if (res.status === 401) { doLock(); return {}; }
  return res.json();
}

// close overlay on backdrop click
document.querySelectorAll('.overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
);

boot();
</script>
